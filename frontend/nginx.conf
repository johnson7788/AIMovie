server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Serve already-gzipped assets produced by vite-plugin-compression
    gzip_static on;

    client_max_body_size 1024m;

    # Hashed build assets: long immutable cache, fail with 404 if missing
    # (never fall back to index.html, which would break module loading).
    location /aimovie/assets/ {
        alias /usr/share/nginx/html/aimovie/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static media/images: fail with 404 if missing instead of returning
    # index.html (which would break <img>/<video> as HTML).
    location /aimovie/static/ {
        alias /usr/share/nginx/html/aimovie/static/;
        try_files $uri =404;
    }

    # SPA entry: only HTML routes fall back to index.html
    location /aimovie/ {
        alias /usr/share/nginx/html/aimovie/;
        try_files $uri $uri/ /aimovie/index.html;
    }

    # Convenience redirect from root to the app
    location = / {
        return 302 /aimovie/;
    }

    # Proxy uploaded/generated files to the backend
    location /api/uploads/ {
        proxy_pass http://backend:8666;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API calls to the backend. Strip the /local prefix.
    location /local/ {
        rewrite ^/local/(.*)$ /$1 break;
        proxy_pass http://backend:8666;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming support
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
